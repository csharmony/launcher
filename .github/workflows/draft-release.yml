name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Launcher.exe
            output: publish-windows
            publish-args: ''
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Launcher_linux64
            output: publish-linux
            publish-args: '-p:AssemblyName=Launcher_linux64 -p:StripSymbols=true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libbrotli-dev

      - name: Publish
        run: dotnet publish Launcher/Launcher.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ inputs.tag }} ${{ matrix.publish-args }} -o ./${{ matrix.output }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ./${{ matrix.output }}/${{ matrix.artifact }}
          if-no-files-found: error

  draft-release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate MD5
        shell: bash
        run: |
          echo "MD5_HASH_WINDOWS=$(md5sum ./artifacts/publish-windows/Launcher.exe | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "MD5_HASH_LINUX=$(md5sum ./artifacts/publish-linux/Launcher_linux64 | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Upload to VirusTotal
        id: vt
        uses: cssnr/virustotal-action@v2
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          file_globs: |
            ./artifacts/publish-windows/Launcher.exe
            ./artifacts/publish-linux/Launcher_linux64
          update_release: false
          sha256: true
          summary: false

      - name: Compose release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '## Changelog' >> body.md
          gh api /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name='${{ inputs.tag }}' \
            --jq '.body' >> body.md
          echo '' >> body.md

          echo '## VirusTotal' >> body.md
          vtResult='${{ steps.vt.outputs.json }}'
          
          echo '### Windows' >> body.md
          echo "**MD5 Hash:** \`${{ env.MD5_HASH_WINDOWS }}\`" >> body.md
          if [ -n "$vtResult" ]; then
            vtLink=$(echo "$vtResult" | jq -r '.[] | select(.name | endswith("Launcher.exe")) | .link')
            echo "[**Check the analysis here.**]($vtLink)" >> body.md
          else
            echo "Failed to upload to VirusTotal." >> body.md
          fi

          echo '### Linux' >> body.md
          echo "**MD5 Hash:** \`${{ env.MD5_HASH_LINUX }}\`" >> body.md
          if [ -n "$vtResult" ]; then
            vtLink=$(echo "$vtResult" | jq -r '.[] | select(.name | endswith("Launcher_linux64")) | .link')
            echo "[**Check the analysis here.**]($vtLink)" >> body.md
          else
            echo "Failed to upload to VirusTotal." >> body.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          body_path: body.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            ./artifacts/publish-windows/Launcher.exe
            ./artifacts/publish-linux/Launcher_linux64
